[defaults]
roles_path = roles
remote_user = ubuntu
# Freshly created EC2 hosts have unknown host keys (and a reused Elastic IP can
# get a new one), so strict checking would block every first deployment.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30
forks = 5
# Fail loudly on deprecated syntax instead of surprising you after an upgrade.
deprecation_warnings = True

[ssh_connection]
pipelining = True
retries = 3
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
