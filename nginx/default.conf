# Nginx reverse proxy for the AutoDeploy stack.
#
#   /            -> Flask app        (app:8000)
#   /grafana/    -> Grafana          (grafana:3000)
#   /metrics     -> blocked (Prometheus scrapes the app directly, inside the Docker network)
#
# This file is mounted at /etc/nginx/conf.d/default.conf, i.e. it lives inside
# the `http {}` context, so http-level directives are allowed here.

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

# Needed to proxy Grafana Live (WebSocket) connections.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # Docker's embedded DNS. Upstreams are referenced through variables below so
    # Nginx re-resolves them at request time. Without this, Nginx would cache the
    # container IP at start-up and break as soon as a container is recreated by a
    # new deployment (or fail to start if an upstream is not up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- Edge health check (used by the Docker healthcheck) -----------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Never expose raw metrics to the internet ----------------------------
    location = /metrics         { return 404; }
    location = /grafana/metrics { return 404; }

    # --- Grafana Live (WebSocket) ---------------------------------------------
    location /grafana/api/live/ {
        set $grafana_upstream http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_pass $grafana_upstream;
    }

    # --- Grafana (served from the /grafana/ sub path) ------------------------
    # Grafana runs with GF_SERVER_SERVE_FROM_SUB_PATH=true, so the original
    # request URI must be passed through unchanged (no URI on proxy_pass).
    location /grafana/ {
        set $grafana_upstream http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $grafana_upstream;
    }

    # Convenience: /grafana -> /grafana/
    location = /grafana {
        return 301 /grafana/;
    }

    # --- Application ----------------------------------------------------------
    location / {
        limit_req zone=per_ip burst=40 nodelay;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        set $app_upstream http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass $app_upstream;
    }
}
