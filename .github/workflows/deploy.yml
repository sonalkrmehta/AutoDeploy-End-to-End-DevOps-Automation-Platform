name: Deploy (reusable)

# Provision -> Configure -> Verify. Called by ci-cd.yml (after a build) and by
# rollback.yml (to redeploy an older image). Not meant to be started directly.
on:
  workflow_call:
    inputs:
      image:
        description: Full image reference including tag, e.g. ghcr.io/owner/repo:sha-1a2b3c4
        required: true
        type: string

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.12.2"
  PYTHON_VERSION: "3.13"
  TF_IN_AUTOMATION: "true"
  TF_STATE_KEY: autodeploy/production/terraform.tfstate

jobs:
  # ---------------------------------------------------------------------------
  provision:
    name: Terraform - provision AWS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ steps.tf.outputs.public_ip }}
    outputs:
      public_ip: ${{ steps.tf.outputs.public_ip }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_instance_type: ${{ vars.EC2_INSTANCE_TYPE || 't3.small' }}
      TF_VAR_allowed_ssh_cidrs: ${{ vars.ALLOWED_SSH_CIDRS || '["0.0.0.0/0"]' }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          missing=()
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SSH_PRIVATE_KEY GRAFANA_ADMIN_PASSWORD \
                      TF_VAR_ssh_public_key AWS_REGION TF_STATE_BUCKET; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error title=Deployment is not configured::Missing secrets/variables: ${missing[*]}. Run scripts/setup-github.sh or follow docs/DEPLOYMENT_GUIDE.md."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false tfplan

      - name: Read outputs
        id: tf
        working-directory: terraform
        run: |
          ip="$(terraform output -raw public_ip)"
          if [[ ! "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::Unexpected public_ip output: '${ip}'"
            exit 1
          fi
          echo "public_ip=${ip}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  configure:
    name: Ansible - configure server & deploy
    needs: provision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ansible
        run: pip install ansible

      - name: Install the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/autodeploy_key
          chmod 600 ~/.ssh/autodeploy_key

      - name: Run the playbook
        working-directory: ansible
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
          APP_IMAGE: ${{ inputs.image }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ansible-playbook -i "${PUBLIC_IP}," -u ubuntu --private-key ~/.ssh/autodeploy_key site.yml \
            -e "app_public_url=http://${PUBLIC_IP}"

  # ---------------------------------------------------------------------------
  verify:
    name: Verify deployment
    needs: [provision, configure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test from the internet
        env:
          PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
          IMAGE: ${{ inputs.image }}
        run: scripts/smoke-test.sh "http://${PUBLIC_IP}" "${IMAGE##*:}"

      - name: Summary
        env:
          PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
          IMAGE: ${{ inputs.image }}
        run: |
          {
            echo "### Deployment succeeded"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Application | http://${PUBLIC_IP}/ |"
            echo "| Grafana | http://${PUBLIC_IP}/grafana/ |"
          } >> "$GITHUB_STEP_SUMMARY"
